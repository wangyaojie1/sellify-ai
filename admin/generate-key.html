<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sellify AI - 生成许可证</title>
  <style>
    :root { --bg: #0f1117; --surface: #1a1d27; --border: #2e3347; --text: #e8ecf1; --muted: #8b91a8; --primary: #6366f1; --gold: #f59e0b; --success: #10b981; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px; max-width: 480px; width: 100%; }
    h1 { font-size: 20px; margin-bottom: 24px; text-align: center; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; margin-top: 12px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: monospace; font-size: 14px; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }
    .btn { display: block; width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; }
    .btn:hover { opacity: 0.9; }
    .result { margin-top: 16px; padding: 16px; background: #0d2818; border: 1px solid #1a5c36; border-radius: 8px; display: none; }
    .result .key { font-size: 22px; font-weight: 700; color: var(--success); letter-spacing: 2px; text-align: center; margin: 8px 0; }
    .copy-btn { background: var(--success); margin-top: 8px; }
    .history { margin-top: 24px; font-size: 12px; color: var(--muted); }
    .history-item { padding: 6px 0; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 生成 Pro 许可证</h1>

    <label>客户邮箱</label>
    <input type="email" id="email" placeholder="customer@gmail.com" />

    <label>客户名称（可选）</label>
    <input type="text" id="name" placeholder="张三" />

    <button class="btn" onclick="generate()">🎫 生成许可证密钥</button>

    <div class="result" id="result">
      <p style="font-size:12px;color:var(--muted)">许可证密钥：</p>
      <div class="key" id="keyDisplay"></div>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">
        客户邮箱：<span id="emailDisplay" style="color:white"></span>
      </p>
      <button class="btn copy-btn" onclick="copyKey()">📋 复制许可证</button>
      <p style="font-size:11px;color:var(--muted);margin-top:8px">
        发给客户：<br>
        「感谢购买 Sellify AI Pro！您的许可证密钥：<strong id="keyForEmail"></strong><br>
        打开扩展设置 → License Key → 粘贴 → Activate 即可解锁 Pro」
      </p>
    </div>

    <div class="history" id="history"></div>
  </div>

  <script>
    function generateKey() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let key = '';
      for (let i = 0; i < 24; i++) {
        if (i > 0 && i % 4 === 0) key += '-';
        key += chars[Math.floor(Math.random() * chars.length)];
      }
      return key;
    }

    function generate() {
      const email = document.getElementById('email').value.trim();
      const name = document.getElementById('name').value.trim();

      if (!email) { alert('请输入客户邮箱'); return; }

      const key = generateKey();
      document.getElementById('keyDisplay').textContent = key;
      document.getElementById('emailDisplay').textContent = email;
      document.getElementById('keyForEmail').textContent = key;
      document.getElementById('result').style.display = 'block';

      // Save to history
      const history = JSON.parse(localStorage.getItem('sellify_keys') || '[]');
      history.unshift({ email, name, key, time: new Date().toLocaleString() });
      localStorage.setItem('sellify_keys', JSON.stringify(history.slice(0, 20)));
      renderHistory();
    }

    function copyKey() {
      const key = document.getElementById('keyDisplay').textContent;
      navigator.clipboard.writeText(key).then(() => {
        alert('已复制！发给客户即可。');
      });
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('sellify_keys') || '[]');
      document.getElementById('history').innerHTML = history.length
        ? '<h3 style="margin-bottom:8px">📋 最近生成：</h3>' + history.map(h =>
            `<div class="history-item">${h.time} — ${h.email} — <code>${h.key}</code></div>`
          ).join('')
        : '';
    }

    renderHistory();
  </script>
</body>
</html>
