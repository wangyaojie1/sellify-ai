<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sellify AI · 许可证管理</title>
  <style>
    :root { --bg: #0a0a0f; --surface: #111118; --card: #16161f; --border: #222233; --text: #f0f0f5; --text2: #8888aa; --primary: #6c5ce7; --gold: #ffa726; --success: #00c853; --danger: #ff5252; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 36px; max-width: 480px; width: 100%; }
    .card::before { content: ''; display: block; height: 3px; background: linear-gradient(90deg, var(--primary), var(--gold)); margin: -36px -36px 24px -36px; border-radius: 20px 20px 0 0; }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 14px; font-family: inherit; }
    .input-group input:focus { outline: none; border-color: var(--primary); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-success { background: var(--success); color: white; margin-top: 8px; }
    .result { margin-top: 16px; padding: 20px; background: linear-gradient(135deg, rgba(0,200,83,0.08), rgba(0,200,83,0.02)); border: 1px solid rgba(0,200,83,0.2); border-radius: 14px; display: none; }
    .result .key { font-size: 24px; font-weight: 800; letter-spacing: 1px; color: var(--success); text-align: center; margin: 8px 0; font-family: 'SF Mono', monospace; word-break: break-all; }
    .history { margin-top: 28px; }
    .history h4 { font-size: 13px; color: var(--text2); margin-bottom: 12px; }
    .h-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--surface); border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
    .h-item code { font-size: 13px; color: var(--primary); }
    .h-time { font-size: 11px; color: var(--text2); }
    .empty { text-align: center; color: var(--text2); font-size: 13px; padding: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔑 生成 Pro 许可证</h2>

    <div class="input-group">
      <label>📧 客户邮箱</label>
      <input type="email" id="email" placeholder="customer@email.com">
    </div>
    <div class="input-group">
      <label>👤 备注（可选）</label>
      <input type="text" id="name" placeholder="客户名称 / 来源">
    </div>

    <button class="btn btn-primary" onclick="generate()">🎫 生成许可证密钥</button>

    <div class="result" id="result">
      <p style="font-size:12px;color:var(--text2);text-align:center;">🔑 许可证密钥</p>
      <div class="key" id="keyDisplay"></div>
      <p style="font-size:12px;color:var(--text2);text-align:center;margin:4px 0;">
        📧 <span id="emailDisplay" style="color:var(--text);"></span>
      </p>
      <button class="btn btn-success" onclick="copyKey()">📋 复制密钥</button>
    </div>

    <div class="history">
      <h4>📋 最近生成</h4>
      <div id="historyList"><div class="empty">暂无记录</div></div>
    </div>
  </div>

  <script>
    const SECRET = 'sellify-ai-pro-secret-key-2026';

    async function genKey(email) {
      const data = email.trim().toLowerCase() + ':' + SECRET;
      const hb = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
      const ha = Array.from(new Uint8Array(hb));
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let k = '';
      for (let i = 0; i < 20; i++) k += chars[ha[i % ha.length] % chars.length];
      return 'SELL-' + k.substring(0,4) + '-' + k.substring(4,8) + '-' + k.substring(8,12) + '-' + k.substring(12,16);
    }

    function generate() {
      const email = document.getElementById('email').value.trim();
      const name = document.getElementById('name').value.trim();
      if (!email || !email.includes('@')) { alert('请输入有效的客户邮箱'); return; }

      genKey(email).then(key => {
        document.getElementById('keyDisplay').textContent = key;
        document.getElementById('emailDisplay').textContent = email;
        document.getElementById('result').style.display = 'block';

        const history = JSON.parse(localStorage.getItem('sellify_keys') || '[]');
        history.unshift({ email, name, key, time: new Date().toLocaleString('zh-CN') });
        localStorage.setItem('sellify_keys', JSON.stringify(history.slice(0, 30)));
        renderHistory();
      });
    }

    function copyKey() {
      const k = document.getElementById('keyDisplay').textContent;
      navigator.clipboard.writeText(k).then(() => {
        const b = event.target; b.textContent = '✅ 已复制！发给客户即可'; setTimeout(() => b.textContent = '📋 复制密钥', 2000);
      });
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('sellify_keys') || '[]');
      const el = document.getElementById('historyList');
      if (!history.length) { el.innerHTML = '<div class="empty">暂无记录</div>'; return; }
      el.innerHTML = history.map(h =>
        `<div class="h-item"><div><strong>${h.email}</strong><br><span class="h-time">${h.time}</span></div><code>${h.key}</code></div>`
      ).join('');
    }

    renderHistory();
  </script>
</body>
</html>
