<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sellify AI Pro — 升级付费</title>
  <style>
    :root { --bg: #0f1117; --surface: #1a1d27; --border: #2e3347; --text: #e8ecf1; --muted: #8b91a8; --primary: #6366f1; --gold: #f59e0b; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px; max-width: 440px; width: 100%; text-align: center; }
    .logo { font-size: 48px; margin-bottom: 8px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    .price { font-size: 42px; font-weight: 800; color: var(--gold); margin: 16px 0; }
    .price span { font-size: 16px; font-weight: 400; color: var(--muted); }
    ul { text-align: left; margin: 16px 0; }
    ul li { padding: 6px 0; font-size: 14px; list-style: none; border-bottom: 1px solid var(--border); }
    ul li::before { content: '✓ '; color: #10b981; font-weight: 700; }
    .steps { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 16px 0; text-align: left; font-size: 13px; line-height: 2; }
    .steps span { display: inline-block; width: 22px; height: 22px; background: var(--primary); color: white; border-radius: 50%; text-align: center; line-height: 22px; font-size: 12px; font-weight: 700; margin-right: 6px; }
    .alert { background: #1a2a1a; border: 1px solid #2a4a2a; border-radius: 8px; padding: 12px; font-size: 13px; color: #10b981; margin: 12px 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1>Sellify AI Pro</h1>
    <p class="sub">无限 AI 查询 · 所有功能解锁</p>

    <div class="price">¥65<span> / 永久</span></div>

    <ul>
      <li>无限次 AI 产品优化</li>
      <li>无限次竞品评论分析</li>
      <li>无限次关键词挖掘</li>
      <li>无限次营销文案生成</li>
      <li>支持 Amazon / eBay / Etsy</li>
      <li>一次付费，永久使用</li>
    </ul>

    <div style="display: flex; gap: 16px; margin: 20px 0; justify-content: center;">
      <div style="text-align: center;">
        <img src="alipay-qr.jpg" alt="支付宝" style="width: 160px; height: 160px; border-radius: 8px; border: 2px solid #1677FF;" />
        <p style="font-size: 12px; margin-top: 6px; color: #1677FF;">支付宝</p>
      </div>
      <div style="text-align: center;">
        <img src="wechat-qr.jpg" alt="微信" style="width: 160px; height: 160px; border-radius: 8px; border: 2px solid #07C160;" />
        <p style="font-size: 12px; margin-top: 6px; color: #07C160;">微信支付</p>
      </div>
    </div>

    <div class="steps">
      <p><span>1</span> <strong>上方扫码支付 ¥65</strong></p>
      <p><span>2</span> <strong>保留付款截图</strong></p>
      <p><span>3</span> <strong>发送截图到邮箱</strong></p>
      <p style="margin-left: 28px; font-size: 13px; word-break: break-all;">📧 sellify.ai@proton.me</p>
      <p><span>4</span> <strong>24小时内收到许可证</strong></p>
      <p style="margin-left: 28px; font-size: 13px;">在扩展设置里输入 → 解锁 Pro</p>
    </div>

    <div class="alert">
      ⚠️ 付款时请备注你的<strong>邮箱地址</strong>，<br>许可证将发送到该邮箱
    </div>
  </div>
</body>
</html>
