<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sellify AI Pro — Upgrade</title>
  <style>
    :root { --bg: #0f1117; --surface: #1a1d27; --border: #2e3347; --text: #e8ecf1; --muted: #8b91a8; --primary: #6366f1; --gold: #f59e0b; --success: #10b981; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 480px; width: 100%; text-align: center; }
    .logo { font-size: 48px; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .tabs { display: flex; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .tab { flex: 1; padding: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; background: none; border-left: none; border-right: none; border-top: none; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .price { font-size: 36px; font-weight: 800; color: var(--gold); margin: 12px 0; }
    .price span { font-size: 15px; font-weight: 400; color: var(--muted); }
    ul { text-align: left; margin: 12px 0; }
    ul li { padding: 5px 0; font-size: 13px; list-style: none; }
    ul li::before { content: '✓ '; color: #10b981; font-weight: 700; }
    .qr-box { display: flex; gap: 12px; margin: 16px 0; justify-content: center; }
    .qr-item img { width: 130px; height: 130px; border-radius: 8px; }
    .alipay-img { border: 2px solid #1677FF; }
    .wechat-img { border: 2px solid #07C160; }
    input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; text-align: center; margin: 8px 0; }
    input:focus { outline: none; border-color: var(--primary); }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-gold { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #1a1a1a); }
    .btn-primary { background: var(--primary); color: white; }
    .result { margin-top: 16px; padding: 16px; background: #0d2818; border: 1px solid #1a5c36; border-radius: 8px; display: none; }
    .result .key { font-size: 22px; font-weight: 700; color: var(--success); letter-spacing: 2px; word-break: break-all; margin: 8px 0; }
    .copy-btn { background: var(--success); color: white; margin-top: 8px; }
    .stripe-btn { background: #635BFF; color: white; font-size: 15px; text-decoration: none; display: block; padding: 14px; border-radius: 8px; font-weight: 600; margin: 16px 0; }
    .stripe-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1>Sellify AI Pro</h1>
    <p class="sub">Unlimited AI queries · All features unlocked</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('cn')">🇨🇳 国内支付</button>
      <button class="tab" onclick="switchTab('intl')">🌍 International</button>
    </div>

    <!-- Chinese Payment -->
    <div id="tab-cn" class="tab-content active">
      <div class="price">¥65<span> / 永久</span></div>
      <div class="qr-box">
        <div class="qr-item">
          <img src="alipay-qr.jpg" alt="Alipay" class="alipay-img" />
          <p style="font-size:12px;color:#1677FF;margin-top:4px;">支付宝</p>
        </div>
        <div class="qr-item">
          <img src="wechat-qr.jpg" alt="WeChat" class="wechat-img" />
          <p style="font-size:12px;color:#07C160;margin-top:4px;">微信支付</p>
        </div>
      </div>
      <input type="email" id="cnEmail" placeholder="输入邮箱 → 立即获取许可证" />
      <button class="btn btn-gold" onclick="genCN()">🎫 获取许可证</button>
    </div>

    <!-- International Payment -->
    <div id="tab-intl" class="tab-content">
      <div class="price">$9<span> / lifetime</span></div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Pay with credit card via Stripe</p>
      <a href="#" id="stripeLink" class="stripe-btn">💳 Pay $9 with Card</a>
      <p style="font-size:11px;color:var(--muted);margin:8px 0;">— or —</p>
      <p style="font-size:13px;color:var(--muted);">PayPal: <strong>send $9 to sellify.ai@proton.me</strong></p>
      <input type="email" id="intlEmail" placeholder="Enter your email" />
      <button class="btn btn-primary" onclick="genIntl()">🎫 Get License Key</button>
    </div>

    <div class="result" id="result">
      <p style="font-size:12px;color:var(--muted)">🔑 Your Pro License Key:</p>
      <div class="key" id="keyDisplay"></div>
      <button class="btn copy-btn" onclick="copyKey()">📋 Copy & Activate</button>
      <p style="font-size:11px;color:var(--muted);margin-top:8px;">
        Open extension → ⚙️ Settings → paste key → Activate → ✅ Pro!
      </p>
    </div>
  </div>

  <script>
    const SECRET = 'sellify-ai-pro-secret-key-2026';

    async function genKey(email) {
      const data = email.trim().toLowerCase() + ':' + SECRET;
      const hb = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
      const ha = Array.from(new Uint8Array(hb));
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let key = '';
      for (let i = 0; i < 20; i++) key += chars[ha[i % ha.length] % chars.length];
      return 'SELL-' + key.substring(0,4) + '-' + key.substring(4,8) + '-' + key.substring(8,12) + '-' + key.substring(12,16);
    }

    function showKey(key) {
      document.getElementById('keyDisplay').textContent = key;
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    }

    async function genCN() {
      const e = document.getElementById('cnEmail').value.trim();
      if (!e.includes('@')) { alert('请输入有效邮箱'); return; }
      showKey(await genKey(e));
    }

    async function genIntl() {
      const e = document.getElementById('intlEmail').value.trim();
      if (!e.includes('@')) { alert('Enter a valid email'); return; }
      showKey(await genKey(e));
    }

    function copyKey() {
      const k = document.getElementById('keyDisplay').textContent;
      navigator.clipboard.writeText(k).then(() => alert('✅ Copied! Paste in extension settings.'));
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab:nth-child(' + (tab === 'cn' ? '1' : '2') + ')').classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
    }

    // Set Stripe link if configured
    const STRIPE_URL = localStorage.getItem('sellify_stripe_url') || '#';
    document.getElementById('stripeLink').href = STRIPE_URL;
  </script>
</body>
</html>
