<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sellify AI</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{
    --bg:#000;--surface:#0a0a0a;--card:#111;--border:#1a1a1a;--border2:#222;
    --text:#fff;--dim:#999;--muted:#555;--brand:#ff6b00;--brand2:#ff8c42;
    --green:#00e676;--red:#ff3d3d;--blue:#3b82f6;
    width:420px;min-height:560px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;
    background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;
    -webkit-font-smoothing:antialiased;margin:0 auto;
  }

  .app{display:flex;flex-direction:column;height:100%}

  /* Header */
  .hdr{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);
  }
  .hdr-l{display:flex;align-items:center;gap:8px}
  .hdr-logo{
    width:28px;height:28px;border-radius:7px;
    background:linear-gradient(135deg,var(--brand),#ff5722);
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .hdr-name{font-size:14px;font-weight:700;letter-spacing:-.3px}
  .hdr-name span{color:var(--dim);font-weight:400}
  .hdr-r{display:flex;align-items:center;gap:8px}
  .pill{
    font-size:9px;font-weight:700;padding:4px 10px;border-radius:100px;
    text-transform:uppercase;letter-spacing:.8px;
  }
  .pill-pro{background:linear-gradient(135deg,var(--brand),#ff5722);color:#000}
  .pill-free{background:var(--border2);color:var(--dim)}

  /* Status bar */
  .status-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);
    font-size:11px;color:var(--dim);
  }
  .status-bar .dot{width:5px;height:5px;background:var(--green);border-radius:50%;display:inline-block;margin-right:6px}
  .status-bar .count{color:var(--text);font-weight:600}

  /* Platform badge */
  .platform-row{
    display:flex;align-items:center;gap:8px;padding:8px 14px;
    background:rgba(59,130,246,.06);border-bottom:1px solid rgba(59,130,246,.1);
    font-size:11px;color:var(--blue);
  }
  .platform-row .shop{font-weight:600;color:var(--blue)}

  /* Tabs */
  .nav{
    display:flex;background:var(--card);border-bottom:1px solid var(--border);
  }
  .nav button{
    flex:1;padding:10px 2px;border:none;background:none;color:var(--muted);
    font-size:10px;font-weight:600;cursor:pointer;letter-spacing:.3px;
    border-bottom:2px solid transparent;font-family:inherit;transition:.15s;
  }
  .nav button.on{color:var(--text);border-bottom-color:var(--brand)}

  /* Content */
  .content{flex:1;overflow-y:auto;padding:14px}

  .section{margin-bottom:12px}
  .section>.label{
    font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:1px;margin-bottom:6px;
  }
  .input-row{position:relative}
  .input-row textarea,.input-row input{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);color:var(--text);font-size:12px;font-family:inherit;
    resize:vertical;transition:.15s;line-height:1.5;
  }
  .input-row textarea:focus,.input-row input:focus{
    outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,107,0,.08);
  }
  .input-row .hint{
    position:absolute;right:10px;top:10px;font-size:10px;color:var(--muted);
    pointer-events:none;
  }

  /* Primary Button */
  .btn-go{
    width:100%;padding:14px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--brand),#ff5722);
    color:#000;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
    letter-spacing:-.2px;transition:all .2s;margin-top:8px;
  }
  .btn-go:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,107,0,.2)}
  .btn-go:disabled{opacity:.4;cursor:not-allowed;transform:none}

  /* Result Panel */
  .result{
    margin-top:16px;padding:0;background:var(--card);border:1px solid var(--border);
    border-radius:12px;overflow:hidden;display:none;
  }
  .result .r-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px;border-bottom:1px solid var(--border);background:var(--surface);
  }
  .result .r-header .r-title{font-size:12px;font-weight:700;letter-spacing:-.2px}
  .result .r-header .r-badge{font-size:9px;color:var(--green);font-weight:600}
  .result .r-body{
    padding:16px;font-size:12px;line-height:1.8;
    max-height:320px;overflow-y:auto;
  }
  .result .r-body h3{font-size:13px;color:var(--brand);margin:14px 0 6px;font-weight:700}
  .result .r-body h3:first-child{margin-top:0}
  .result .r-body strong{color:var(--text);font-weight:600}
  .result .r-body ul,.result .r-body ol{padding-left:16px;margin:4px 0}
  .result .r-body li{margin:2px 0}
  .result .r-body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
  .result .r-body th{background:var(--surface);padding:6px 8px;text-align:left;border:1px solid var(--border);font-size:10px;color:var(--dim)}
  .result .r-body td{padding:6px 8px;border:1px solid var(--border)}
  .result .r-body code{background:var(--surface);padding:1px 4px;border-radius:3px;font-size:10px;color:var(--brand)}
  .result .r-footer{
    padding:10px 16px;border-top:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted);
  }

  /* Loading */
  .loading{
    text-align:center;padding:30px 20px;display:none;
  }
  .loading .ring{
    width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--brand);
    border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading .msg{font-size:12px;color:var(--dim)}

  /* Empty state */
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty .icon{font-size:40px;margin-bottom:12px}
  .empty .title{font-size:14px;font-weight:600;color:var(--dim);margin-bottom:4px}
  .empty .desc{font-size:11px;line-height:1.6}

  /* Footer */
  .ftr{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 14px;border-top:1px solid var(--border);background:var(--card);
    font-size:10px;color:var(--muted);
  }
  .ftr .upgrade{color:var(--brand);cursor:pointer;font-weight:600;text-decoration:none}
  .ftr .upgrade:hover{text-decoration:underline}

  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>
<div class="app">

  <header class="hdr">
    <div class="hdr-l">
      <div class="hdr-logo">⚡</div>
      <div class="hdr-name">Sellify <span>AI</span></div>
    </div>
    <div class="hdr-r">
      <span id="planPill" class="pill pill-free">Free</span>
    </div>
  </header>

  <div class="status-bar">
    <span><span class="dot"></span> AI Ready</span>
    <span>Daily quota: <span class="count" id="quotaLeft">3</span>/10 free</span>
  </div>

  <div class="platform-row">
    <span>📦</span>
    <span>Amazon Listing Optimizer</span>
  </div>

  <div class="nav">
    <button class="on">Listing Optimizer</button>
    <button>Review Analyzer</button>
    <button>Keywords</button>
    <button>Ad Copy</button>
  </div>

  <div class="content">

    <!-- Step 1 -->
    <div class="section">
      <div class="label">Product Title</div>
      <div class="input-row">
        <textarea id="title" rows="2" placeholder="e.g. Wireless Bluetooth Headphones, Active Noise Cancelling, 40H Battery Life...">Wireless Bluetooth Headphones Over Ear, Active Noise Cancelling, 40H Battery, Hi-Fi Audio, Memory Foam Ear Cups</textarea>
      </div>
    </div>

    <!-- Step 2 -->
    <div class="section">
      <div class="label">Bullet Points / Features</div>
      <div class="input-row">
        <textarea id="desc" rows="4" placeholder="Enter your current bullet points or product features...">🎵 Hi-Fi Audio with 40mm custom drivers
🔇 Active Noise Cancelling - blocks 95% noise
🔋 40 Hours Battery Life + USB-C fast charge
👂 Memory Foam Ear Cups for all-day comfort
🎤 ENC Microphones for crystal clear calls</textarea>
      </div>
    </div>

    <!-- Step 3 -->
    <div class="section">
      <div class="label">Category</div>
      <div class="input-row">
        <input id="cat" value="Electronics > Headphones > Over-Ear" placeholder="e.g. Home & Kitchen > Kitchen Gadgets">
      </div>
    </div>

    <button class="btn-go" id="optBtn" onclick="doOptimize()">
      Analyze & Optimize Listing
    </button>

    <div class="loading" id="loading">
      <div class="ring"></div>
      <div class="msg">AI is analyzing your listing...</div>
    </div>

    <div class="result" id="result">
      <div class="r-header">
        <span class="r-title">AI Optimization Report</span>
        <span class="r-badge">✓ Optimized</span>
      </div>
      <div class="r-body" id="resultBody"></div>
      <div class="r-footer">
        <span id="resultTokens"></span>
        <span>Powered by Sellify AI</span>
      </div>
    </div>

  </div>

  <footer class="ftr">
    <span>Sellify AI v1.0</span>
    <a href="file:///C:/Users/leovo/ecom-ai-assistant/payment/index.html" class="upgrade">Upgrade to Pro →</a>
  </footer>

</div>

<script>
const API_KEY = 'sk-ba93382363724192a55cf387202c1ded';

function mdToHtml(md){
  if(!md)return'';
  return md
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^[-\*] (.+)$/gm,'<li>$1</li>')
    .replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>')
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}

async function doOptimize(){
  const title=document.getElementById('title').value.trim();
  const desc=document.getElementById('desc').value.trim();
  const cat=document.getElementById('cat').value.trim();
  if(!title){alert('Please enter a product title');return}

  document.getElementById('result').style.display='none';
  const loading=document.getElementById('loading');
  loading.style.display='block';
  loading.scrollIntoView({behavior:'smooth'});

  const btn=document.getElementById('optBtn');
  btn.disabled=true;btn.textContent='Analyzing...';

  try{
    const res=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body:JSON.stringify({
        model:'deepseek-chat',max_tokens:1400,temperature:0.7,
        messages:[
          {role:'system',content:'You are a world-class Amazon listing optimizer. Your advice is data-driven, specific, and actionable. Use bold for key metrics. Format with clear markdown sections. Speak like a professional e-commerce consultant — not a chatbot.'},
          {role:'user',content:`Optimize this Amazon listing:\n\nTITLE: ${title}\n\nCURRENT BULLETS:\n${desc}\n\nCATEGORY: ${cat}\n\nProvide a professional optimization report with:\n\n## Title Strategy\n- Best title for search ranking (under 200 chars)\n- 2 alternative titles for A/B testing\n\n## Bullet Points (Rewritten)\n- 5 benefit-rich bullets with emotional triggers and keywords\n\n## Backend Search Terms\n- 15-20 high-value search terms (space-separated, no commas)\n\n## Quick Wins\n- 3 specific, low-effort improvements to boost conversion today\n\n## Competitive Edge\n- How to beat competitors at this price point`}
        ]
      })
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);

    loading.style.display='none';
    document.getElementById('resultBody').innerHTML=mdToHtml(data.choices[0].message.content);
    document.getElementById('resultTokens').textContent='Tokens: '+data.usage.total_tokens+' | ~$0.001';
    document.getElementById('result').style.display='block';
    document.getElementById('result').scrollIntoView({behavior:'smooth'});

    btn.textContent='Optimize Another Listing';
    btn.disabled=false;

  }catch(e){
    loading.style.display='none';
    alert('Error: '+e.message);
    btn.textContent='Analyze & Optimize Listing';
    btn.disabled=false;
  }
}
</script>
</body>
</html>
